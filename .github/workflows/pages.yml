name: Deploy demo to GitHub Pages

# Publishes the SHOWCASE build: the demonstration only — landing page, guided
# tour, synthetic dataset — for people who will never run the backend. API
# mode is not hidden in this bundle, it is absent: `vite build --mode
# showcase` compiles it out, and `check:showcase` fails the deploy if any
# API-mode string or network primitive survived (docs/adr/0006). Safe to host
# publicly: no request leaves the page and there is no credential to ship.

on:
  push:
    branches: [main]
  # Lets the demo be published from a feature branch while a PR is in review.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The full build is built too, only so the bundle check has a control:
      # a scan that finds the API strings there proves it can see them.
      - name: Build (full, as the check's control)
        run: npm run build

      - name: Build the showcase
        run: npm run build:showcase

      - name: Prove API mode is not in the public bundle
        run: npm run check:showcase

      # vite's `base: './'` makes every asset URL relative, so the same bundle
      # works at the repository subpath Pages serves from without any rewrite.
      #
      # The 404 copy does NOT make deep links work — hash routing already
      # does that, because the fragment in `/scorecard-pipeline/#/demo/esteira`
      # is never sent to the server: the request is for the base path and
      # returns index.html. What this copy buys is a graceful landing when
      # someone requests a PATH that does not exist (a hand-typed
      # `/scorecard-pipeline/entrevistas`, say): GitHub serves the app instead
      # of its generic 404 page, and the app boots with no hash and shows the
      # landing page. The HTTP status is still 404, which is correct.
      - name: Serve the app on unknown paths
        run: cp dist-showcase/index.html dist-showcase/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist-showcase

      - id: deployment
        uses: actions/deploy-pages@v4
