<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorecard Pipeline — Revisão de Entrevistas</title>
    <meta
      name="description"
      content="Revisão de scorecards de entrevistas com verificação de evidência: destaca quando o modelo cita uma frase que não existe na transcrição."
    />
    <!-- Inline SVG favicon: no binary asset, no extra request, and it keeps
         the hosted demo from showing a broken-icon tab. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b52c7'/%3E%3Cpath d='M8 17.5l5 5 11-12' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- The theme is chosen at runtime from localStorage; declaring both tells
         the browser to pick a sensible form control palette before React
         mounts, which avoids a flash of the wrong scrollbar. -->
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
